<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reactive agent video documentation</title>
<meta name="description" content="Scenarios, work in progress and visualisations from a reactive agent prototype.">
<meta property="og:type" content="website">
<meta property="og:title" content="Reactive agent video documentation">
<meta property="og:description" content="Scenarios, work in progress and visualisations from a reactive agent prototype.">
<meta property="og:image" content="https://agent-widget-scenarios.vercel.app/posters/2026-11-14_SC01_scenario-resting-high-energy.jpg">
<meta property="og:url" content="https://agent-widget-scenarios.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900; font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Inter";
    src: url("fonts/inter-latin-ext-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900; font-display: swap;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --paper: #f8f8f6;
    --sheet: #ffffff;
    --ink: #1a1a1a;
    --mute: #9a9a9a;
    --rule: #e6e6e6;
    --blue: #2f6bff;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --nav-w: clamp(264px, 24vw, 340px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font: 400 14px/1.5 "Inter", ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: "cv11" 1;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
    height: 100vh; height: 100dvh; overflow: hidden;
  }
  .id, .d, .time { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }

  /* ---------- Menu ---------- */
  nav { padding: 40px 32px 40px 44px; overflow-y: auto; display: flex; flex-direction: column; }
  .site { margin-bottom: 56px; }
  .site h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .site p { color: var(--mute); }

  .view {
    position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; margin-bottom: 28px;
    padding: 3px; border-radius: 999px; background: rgba(26, 26, 26, .055);
  }
  .view button { position: relative; z-index: 1; padding: 4px 14px; font-size: 12px; font-weight: 500; color: var(--mute); transition: color .3s var(--ease); }
  .view button[aria-pressed="true"] { color: var(--ink); }
  .view .pill {
    position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px;
    background: var(--sheet); box-shadow: 0 0 0 1px var(--rule), 0 1px 2px rgba(26, 26, 26, .06);
    transition: transform .45s var(--ease);
  }
  .view[data-mode="date"] .pill { transform: translateX(100%); }

  .menu { position: relative; list-style: none; transition: opacity .18s var(--ease), transform .18s var(--ease); }
  .menu.switching { opacity: 0; transform: translateY(4px); }
  .menu.switching .lamp { opacity: 0; }
  .group + .group { margin-top: 36px; }
  .group h2 { font-size: 12px; font-weight: 400; color: var(--mute); margin-bottom: 10px; }
  .group ol { list-style: none; }

  .item {
    display: grid; grid-template-columns: 40px 1fr auto; align-items: baseline; gap: 0 10px;
    width: 100%; text-align: left; padding: 5px 0;
    color: var(--mute); transition: color .25s var(--ease);
  }
  .item .id { font-size: 12px; font-weight: 400; }
  .item .t { transition: transform .35s var(--ease); }
  .item .d { font-size: 12px; }
  .item:hover, .item[aria-current="true"] { color: var(--ink); }
  .item:hover .t { transform: translateX(3px); }
  .item[aria-current="true"] .t { transform: none; }

  /* The lead category reads first: larger, tighter set. */
  .group.lead .item { padding: 6px 0; }
  .group.lead .item .t { font-size: clamp(20px, 1.8vw, 24px); font-weight: 500; line-height: 1.15; letter-spacing: -0.025em; }

  /* Active marker: a plain blue dot that glides to the chosen item. */
  .lamp {
    position: absolute; left: -24px; top: 0; width: 8px; height: 8px; margin-top: -4px;
    border-radius: 50%; background: var(--blue); pointer-events: none; opacity: 0;
    transform: translateY(var(--y, 0px));
    transition: transform .7s var(--ease), opacity .4s var(--ease);
  }
  .lamp.on { opacity: 1; }

  /* ---------- Player ---------- */
  main {
    display: grid; grid-template-rows: minmax(0, 1fr) auto;
    padding: 28px 40px 24px 0; gap: 14px; min-width: 0; min-height: 0;
  }
  .frame {
    position: relative; min-height: 0; border-radius: 14px; overflow: hidden;
    background: var(--sheet); box-shadow: 0 0 0 1px var(--rule);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  video {
    display: block; width: 100%; height: 100%; object-fit: contain;
    transition: opacity .42s var(--ease), filter .42s var(--ease), transform .6s var(--ease);
  }
  .frame.swap video { opacity: 0; filter: blur(10px); transform: scale(.985); transition-duration: .22s; }
  .bigplay {
    position: absolute; width: 64px; height: 64px; border-radius: 50%;
    background: rgba(26, 26, 26, .82); color: #fff; display: grid; place-items: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .bigplay svg { width: 18px; height: 18px; margin-left: 3px; }
  .frame.playing .bigplay { opacity: 0; transform: scale(.9); pointer-events: none; }

  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px 24px; }
  .scrub {
    grid-column: 1 / -1; position: relative; height: 14px; cursor: pointer; touch-action: none;
  }
  .scrub::before, .scrub i { content: ""; position: absolute; left: 0; top: 6px; height: 2px; border-radius: 2px; }
  .scrub::before { right: 0; background: var(--rule); }
  .scrub i { width: 0; background: var(--blue); }
  .caption { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; min-width: 0; }
  .caption .id { font-size: 12px; color: var(--mute); }
  .caption .t { font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
  .caption .m { color: var(--mute); font-size: 13px; }
  .controls { display: flex; align-items: center; gap: 4px; color: var(--ink); }
  .controls .time { font-size: 13px; color: var(--mute); margin-right: 8px; white-space: nowrap; }
  .controls button { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; transition: background .2s; }
  .controls button:hover { background: rgba(26, 26, 26, .06); }
  .controls svg { width: 16px; height: 16px; }

  /* ---------- One load sequence ---------- */
  .reveal { opacity: 0; transform: translateY(6px); animation: rise .7s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 55ms + 80ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; overflow: auto; }
    nav { padding: 28px 22px 8px 40px; }
    .site { margin-bottom: 32px; }
    main { padding: 16px 16px 32px; grid-template-rows: auto auto; }
    .frame { aspect-ratio: 4 / 3; }
    .bar { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<nav aria-label="Videos">
  <header class="site reveal">
    <h1>Reactive agent</h1>
    <p>Video documentation</p>
  </header>
  <div class="view reveal" id="view" role="group" aria-label="Sort videos" style="--i:1" data-mode="category">
    <span class="pill" aria-hidden="true"></span>
    <button data-mode="category" aria-pressed="true">Category</button>
    <button data-mode="date" aria-pressed="false">Date</button>
  </div>
  <ul class="menu" id="menu"><li class="lamp" id="lamp" aria-hidden="true"></li></ul>
</nav>

<main>
  <div class="frame reveal" id="frame" style="--i:2">
    <video id="player" playsinline preload="metadata"></video>
    <span class="bigplay" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg></span>
  </div>
  <div class="bar reveal" style="--i:3">
    <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress"></i></div>
    <div class="caption" aria-live="polite">
      <span class="id" id="capId"></span>
      <span class="t" id="capTitle"></span>
      <span class="m" id="capMeta"></span>
    </div>
    <div class="controls">
      <span class="time" id="time">0:00 / 0:00</span>
      <button id="toggle" aria-label="Play"><svg viewBox="0 0 16 16" id="toggleIcon"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg></button>
      <button id="full" aria-label="Full screen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.75 5.5V1.75H5.5M10.5 1.75h3.75V5.5M14.25 10.5v3.75H10.5M5.5 14.25H1.75V10.5"/></svg></button>
    </div>
  </div>
</main>

<script>
  // To add a video: put the .mp4 in /videos and a .jpg poster in /posters
  // (named YYYY-MM-DD_ID_description), then add an entry below.
  const CATEGORIES = ["Scenarios", "Co-work in progress", "AI visualisation"];
  const LEAD = "Scenarios";
  const VIDEOS = [
    { id: "SC01", category: "Scenarios",           title: "Resting, high energy",   date: "2026-11-14", file: "2026-11-14_SC01_scenario-resting-high-energy" },
    { id: "CW01", category: "Co-work in progress", title: "Co-working session 01",  date: "2026-11-14", file: "2026-11-14_CW01_co-working-session-01" },
    { id: "CW02", category: "Co-work in progress", title: "Co-working session 02",  date: "2026-11-14", file: "2026-11-14_CW02_co-working-session-02" },
    { id: "AV01", category: "AI visualisation",    title: "Low alertness",          date: "2026-11-10", file: "2026-11-10_AV01_low-alertness" },
  ];

  const $ = id => document.getElementById(id);
  const menu = $("menu"), lamp = $("lamp"), player = $("player"), frame = $("frame"), view = $("view");
  const flat = VIDEOS, durations = {};
  let buttons = {}, current = null;
  const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
  const longDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

  function groupsFor(mode) {
    if (mode === "date") {
      const days = [...new Set(VIDEOS.map(v => v.date))].sort().reverse();
      return days.map(d => ({ name: longDate(d), lead: false, items: VIDEOS.filter(v => v.date === d) }));
    }
    return CATEGORIES.map(c => ({ name: c, lead: c === LEAD, items: VIDEOS.filter(v => v.category === c) }))
                     .filter(g => g.items.length);
  }

  function render(mode, animateIn) {
    menu.querySelectorAll(".group").forEach(n => n.remove());
    buttons = {};
    groupsFor(mode).forEach((g, gi) => {
      const li = document.createElement("li");
      li.className = "group" + (g.lead ? " lead" : "") + (animateIn ? " reveal" : "");
      li.style.setProperty("--i", gi + 2);
      li.innerHTML = `<h2></h2><ol></ol>`;
      li.querySelector("h2").textContent = g.name;
      g.items.forEach(v => {
        const b = document.createElement("button");
        b.className = "item";
        b.innerHTML = `<span class="id"></span><span class="t"></span><span class="d"></span>`;
        b.querySelector(".id").textContent = v.id;
        b.querySelector(".t").textContent = v.title;
        b.querySelector(".d").textContent = durations[v.id] || "";
        if (current) b.setAttribute("aria-current", current.id === v.id);
        b.onclick = () => {
          history.replaceState(null, "", "#" + v.id.toLowerCase()); select(v, true);
          if (matchMedia("(max-width: 760px)").matches) frame.scrollIntoView({ behavior: "smooth", block: "start" });
        };
        buttons[v.id] = b;
        const row = document.createElement("li"); row.appendChild(b);
        li.querySelector("ol").appendChild(row);
      });
      menu.appendChild(li);
    });
    if (current) placeLamp(current);
  }

  // Durations, read quietly from each file's metadata.
  VIDEOS.forEach(v => {
    const probe = document.createElement("video");
    probe.preload = "metadata"; probe.src = `videos/${v.file}.mp4`;
    probe.onloadedmetadata = () => {
      durations[v.id] = fmt(probe.duration);
      const d = buttons[v.id] && buttons[v.id].querySelector(".d");
      if (d) d.textContent = durations[v.id];
      probe.removeAttribute("src"); probe.load();
    };
  });

  let mode = "category";
  try { if (localStorage.getItem("view") === "date") mode = "date"; } catch (e) {}
  function setMode(m, animate) {
    mode = m;
    view.dataset.mode = m;
    view.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
    try { localStorage.setItem("view", m); } catch (e) {}
    if (!animate) return render(m, true);
    menu.classList.add("switching");
    setTimeout(() => { render(m, false); requestAnimationFrame(() => menu.classList.remove("switching")); }, 180);
  }
  view.querySelectorAll("button").forEach(b => b.onclick = () => b.dataset.mode !== mode && setMode(b.dataset.mode, true));

  function placeLamp(v) {
    const t = buttons[v.id].querySelector(".t");
    const lh = parseFloat(getComputedStyle(t).lineHeight) || t.offsetHeight;
    const y = t.getBoundingClientRect().top - menu.getBoundingClientRect().top + lh / 2;
    lamp.style.setProperty("--y", y + "px");
    lamp.classList.add("on");
  }

  function select(v, play) {
    for (const k in buttons) buttons[k].setAttribute("aria-current", k === v.id);
    placeLamp(v);
    $("capId").textContent = v.id;
    $("capTitle").textContent = v.title;
    $("capMeta").textContent = `${v.category}, ${longDate(v.date)}`;
    document.title = `${v.id} ${v.title} | Reactive agent`;
    if (current === v) { if (play) { player.currentTime = 0; player.play().catch(() => {}); } return; }
    current = v;
    const swap = () => {
      player.poster = `posters/${v.file}.jpg`;
      player.src = `videos/${v.file}.mp4`;
      player.addEventListener("loadeddata", () => frame.classList.remove("swap"), { once: true });
      if (play) player.play().catch(() => {});
      else frame.classList.remove("swap");
    };
    if (player.src) { frame.classList.add("swap"); setTimeout(swap, 220); } else swap();
  }

  // Controls
  const toggle = () => player.paused ? player.play().catch(() => {}) : player.pause();
  frame.onclick = toggle;
  $("toggle").onclick = toggle;
  $("full").onclick = () => (frame.requestFullscreen || frame.webkitRequestFullscreen || (() => player.webkitEnterFullscreen && player.webkitEnterFullscreen())).call(frame);
  const PLAY = '<path d="M3 1.5v13l11-6.5z" fill="currentColor"/>';
  const PAUSE = '<path d="M3.5 2h3v12h-3zM9.5 2h3v12h-3z" fill="currentColor"/>';
  const sync = () => {
    const playing = !player.paused;
    frame.classList.toggle("playing", playing);
    $("toggleIcon").innerHTML = playing ? PAUSE : PLAY;
    $("toggle").setAttribute("aria-label", playing ? "Pause" : "Play");
  };
  ["play", "pause", "ended"].forEach(e => player.addEventListener(e, sync));
  player.addEventListener("timeupdate", () => {
    const p = player.duration ? player.currentTime / player.duration * 100 : 0;
    $("progress").style.width = p + "%";
    $("scrub").setAttribute("aria-valuenow", Math.round(p));
    $("time").textContent = `${fmt(player.currentTime)} / ${fmt(player.duration)}`;
  });
  player.addEventListener("loadedmetadata", () => $("time").textContent = `0:00 / ${fmt(player.duration)}`);

  const scrub = $("scrub");
  const seek = e => { const r = scrub.getBoundingClientRect(); if (player.duration) player.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * player.duration; };
  scrub.addEventListener("pointerdown", e => { scrub.setPointerCapture(e.pointerId); seek(e); scrub.onpointermove = seek; });
  scrub.addEventListener("pointerup", () => scrub.onpointermove = null);
  scrub.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") player.currentTime += 5;
    if (e.key === "ArrowLeft") player.currentTime -= 5;
  });
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); toggle(); }
  });

  const fromHash = () => flat.find(v => v.id.toLowerCase() === location.hash.slice(1).toLowerCase());
  window.addEventListener("hashchange", () => { const v = fromHash(); if (v) select(v, true); });
  window.addEventListener("resize", () => current && placeLamp(current));
  document.fonts.ready.then(() => current && placeLamp(current));

  setMode(mode, false);
  select(fromHash() || flat[0], false);
</script>
</body>
</html>
